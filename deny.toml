# cargo-deny policy: advisories, bans, licenses, sources.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained notices (no known vulnerability), both build-time proc-macros reachable only
# through the pinned UI stack; remove when specta / the Tauri GTK3 backend drop them.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste: proc-macro used by specta 2.0.0-rc.25; no exploitable code at runtime" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: proc-macro used by gtk3-rs macros (Tauri Linux backend); no runtime code" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow-wildcard-paths = true
deny = [
    # TLS goes through rustls with the platform verifier (ADR-003): no OpenSSL.
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
