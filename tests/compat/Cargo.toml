[package]
name = "opensvn-compat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Compat harness: runs scenarios against pinned svn 1.14/1.15 containers and compares results"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "compat-run"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
rusqlite.workspace = true
# YAML scenario files (safe-Rust parser; serde_yaml forks pull in unmaintained unsafe-libyaml).
# Not in [workspace.dependencies]: exact pin kept local to the harness.
serde-saphyr = "=1.3.0"

[dev-dependencies]
tempfile.workspace = true
