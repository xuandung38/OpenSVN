# A text conflict made by one client's update is resolved by the other client.
name: op-resolve
repo: basic
fresh_repo: true
steps:
  - { on: svn15, wc: w, svn: [checkout, "{url}/trunk", "."] }
  - { on: engine, wc: e, svn: [checkout, "{url}/trunk", "."] }
  - { on: svn15, wc: s, svn: [checkout, "{url}/trunk", "."] }
  - { on: svn15, wc: o, svn: [checkout, "{url}/trunk", "."] }
  - { on: svn15, wc: w, sh: "printf 'server line\\n' > docs/index.md" }
  - { on: svn15, wc: w, svn: [commit, -m, "incoming change"] }
  - { on: svn15, wc: e, sh: "printf 'local line\\n' > docs/index.md" }
  - { on: svn15, wc: s, sh: "printf 'local line\\n' > docs/index.md" }
  - { on: svn15, wc: o, sh: "printf 'local line\\n' > docs/index.md" }
  # The engine updates into a conflict, svn resolves it; svn updates, the engine resolves.
  - { on: engine, wc: e, svn: [update] }
  - { on: svn14, wc: e, svn: [resolve, --accept, theirs-full, docs/index.md] }
  - { on: svn15, wc: s, svn: [update, --accept, postpone] }
  - { on: engine, wc: s, svn: [resolve, --accept, theirs-full, docs/index.md] }
  # The oracle: svn alone (its pristine store keeps the old text until cleanup, as above).
  - { on: svn15, wc: o, svn: [update, --accept, postpone] }
  - { on: svn15, wc: o, svn: [resolve, --accept, theirs-full, docs/index.md] }
compare:
  - { left: e, right: o, checks: [tree, status, info, wcdb], ignore: [dav_cache] }
  - { left: s, right: o, checks: [tree, status, info, wcdb], ignore: [dav_cache] }
