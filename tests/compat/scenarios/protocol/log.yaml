# Protocol scenarios: record real traffic -> parse with svn-protocol -> compare with `svn ... --xml`.
# Format is provisional until the compat harness fixes its DSL; the fields below are what the
# svn-protocol golden tests (crates/svn-protocol/tests) already exercise today.
scenarios:
  - id: protocol-log-verbose
    description: log-report with changed paths equals `svn log --xml -v`
    server: mod_dav_svn 1.14.5 (SVNAllowBulkUpdates Prefer)
    reference: { client: svn 1.15.0, command: "svn log --xml -v ${URL}/trunk" }
    fixture: crates/svn-protocol/tests/data/log/head-verbose
    compare: [revision, author, date, message, changed_paths, copyfrom]
  - id: protocol-log-copy-source
    description: copyfrom-path/copyfrom-rev reported for a branch copy
    reference: { client: svn 1.15.0, command: "svn log --xml -v ${URL}" }
    fixture: crates/svn-protocol/tests/data/log/root-with-copy
    compare: [revision, changed_paths, copyfrom]
  - id: protocol-log-limit-all-revprops
    description: limit and all-revprops
    reference: { client: svn 1.15.0, command: "svn log --xml -v -l 2 --with-all-revprops ${URL}" }
    fixture: crates/svn-protocol/tests/data/log/limit2-all-revprops
    compare: [revision, author, date, message, changed_paths]
  - id: protocol-log-merged-revisions
    description: include-merged-revisions nesting (has-children, end marker)
    reference: { client: svn 1.15.0, command: "svn log --xml -v -g -l 3 ${URL}/trunk" }
    fixture: crates/svn-protocol/tests/data/log/merged-revisions
    compare: [revision, nesting, changed_paths]
