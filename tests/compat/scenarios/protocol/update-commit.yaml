# See log.yaml for the status of this format.
scenarios:
  - id: protocol-update-send-all-and-skelta
    description: checkout and update in both modes, switch, status -u, sparse, mixed working copy
    reference: { client: svn 1.15.0, command: "svn checkout|update|switch|status -u ${URL}/trunk" }
    fixtures:
      - crates/svn-protocol/tests/data/update/checkout-send-all
      - crates/svn-protocol/tests/data/update/checkout-skelta
      - crates/svn-protocol/tests/data/update/update-rich
      - crates/svn-protocol/tests/data/update/update-rich-skelta
      - crates/svn-protocol/tests/data/update/switch
      - crates/svn-protocol/tests/data/update/status-u
      - crates/svn-protocol/tests/data/update/update-sparse
      - crates/svn-protocol/tests/data/update/update-mixed
    compare: [request_body_as_xml, event_stream_well_formed, chunk_split_equivalence]
  - id: protocol-commit-sequence
    description: create-txn, MKCOL, PUT, DELETE, COPY, PROPPATCH, MERGE, abort; locked path
    reference: { client: svn 1.15.0, command: "svn commit" }
    fixtures:
      - crates/svn-protocol/tests/data/commit/full-create-txn
      - crates/svn-protocol/tests/data/commit/full-merge
      - crates/svn-protocol/tests/data/commit/lock-put
      - crates/svn-protocol/tests/data/commit/lock-merge
      - crates/svn-protocol/tests/data/commit/abort-txn
    compare: [request_bytes_equal]
  - id: protocol-blame
    description: file-revs-report
    reference: { client: svn 1.15.0, command: "svn blame --xml ${URL}/trunk/a.txt" }
    fixture: crates/svn-protocol/tests/data/file_revs/blame
  - id: protocol-older-server-capabilities
    description: servers without list, svndiff1/2, inline-props, bulk-update switch, create-txn-with-props
    fixture: crates/svn-protocol/tests/data/caps/options-200   # synthesized variants in tests/older_servers.rs
    note: replace the synthesized variants with recordings from 1.8, 1.9 and 1.10 servers
