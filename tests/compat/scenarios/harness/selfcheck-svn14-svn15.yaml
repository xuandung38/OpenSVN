# Cross-version sanity: svn14 and svn15 clients checking out the same revision must produce
# identical trees, status and info (wc.db is compared too: both write format 31).
name: selfcheck-svn14-svn15
description: svn14 vs svn15 checkout of the same repo
server: svn15
repo: basic
steps:
  - { on: svn14, wc: a, svn: [checkout, "{url}/trunk", "."] }
  - { on: svn15, wc: b, svn: [checkout, "{url}/trunk", "."] }
compare:
  - { left: a, right: b, checks: [tree, status, info] }
