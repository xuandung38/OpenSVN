# Minimal httpd for mod_dav_svn, modelled on a VisualSVN-style deployment.
ServerRoot /etc/apache2
ServerName svn.test.local
PidFile /tmp/svn-httpd.pid
DefaultRuntimeDir /tmp
Mutex file:/tmp default
User www-data
Group www-data
Listen 8443

LoadModule mpm_event_module  /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authn_core_module /usr/lib/apache2/modules/mod_authn_core.so
LoadModule authn_file_module /usr/lib/apache2/modules/mod_authn_file.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule authz_user_module /usr/lib/apache2/modules/mod_authz_user.so
LoadModule auth_basic_module /usr/lib/apache2/modules/mod_auth_basic.so
LoadModule dumpio_module     /usr/lib/apache2/modules/mod_dumpio.so
LoadModule alias_module      /usr/lib/apache2/modules/mod_alias.so
LoadModule dav_module        /usr/lib/apache2/modules/mod_dav.so
LoadModule dav_svn_module    /usr/local/libexec/mod_dav_svn.so
LoadModule socache_shmcb_module /usr/lib/apache2/modules/mod_socache_shmcb.so
LoadModule ssl_module        /usr/lib/apache2/modules/mod_ssl.so

# Request lines (access.log) and, with SVN_DUMPIO=1, full bodies (error.log) for capture.
ErrorLog /var/log/svn-httpd/error.log
LogLevel warn
LogFormat "%h %u \"%r\" %>s %O \"%{Depth}i\"" compat
CustomLog /var/log/svn-httpd/access.log compat
<IfDefine DUMPIO>
  DumpIOInput On
  DumpIOOutput On
  LogLevel warn dumpio:trace7
</IfDefine>

SSLEngine on
SSLCertificateFile /certs/server.crt
SSLCertificateKeyFile /certs/server.key
SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLSessionCache shmcb:/tmp/ssl_scache(512000)

<Location /svn>
  DAV svn
  SVNParentPath /var/svn/repos
  SVNListParentPath On
  SVNAdvertiseV2Protocol On
  SVNAllowBulkUpdates Prefer
  SVNAutoversioning Off
  AuthType Basic
  AuthName "OpenSVN compat"
  AuthBasicProvider file
  AuthUserFile /etc/svn-htpasswd
  Require valid-user
</Location>
