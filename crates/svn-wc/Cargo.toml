[package]
name = "svn-wc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Subversion working copy engine: wc.db (format 31/32), pristine store, work queue"

[lints]
workspace = true

[features]
# Crash-injection points (`fail::fail_point!`); enabled only by tests and the crash suite, never in release.
failpoints = ["dep:fail", "fail/failpoints"]

[dependencies]
svn-types.workspace = true
thiserror.workspace = true
rusqlite = { workspace = true, features = ["functions"] }
sha1.workspace = true
md-5.workspace = true
tracing.workspace = true
tempfile.workspace = true
fail = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
