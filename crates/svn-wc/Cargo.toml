[package]
name = "svn-wc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Subversion working copy engine: wc.db (format 31/32), pristine store, work queue"

[lints]
workspace = true

[features]
failpoints = ["dep:fail"]

[dependencies]
svn-types.workspace = true
thiserror.workspace = true
rusqlite = { workspace = true, features = ["functions"] }
sha1.workspace = true
md-5.workspace = true
tracing.workspace = true
# Fault injection for crash-safety tests; compiled out unless the `failpoints` feature is on.
fail = { workspace = true, optional = true, features = ["failpoints"] }

[dev-dependencies]
tempfile.workspace = true
