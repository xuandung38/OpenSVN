[package]
name = "opensvn-ipc"
version = "0.0.0"
edition = "2024"
publish = false
description = "UI <-> Rust IPC contract types (docs/system-design/03), exported to TypeScript via specta"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
time = { version = "=0.3.55", features = ["formatting"] }
tracing = "=0.1.44"

[dev-dependencies]
insta = "=1.49.0"
serde_json = "=1.0.154"
