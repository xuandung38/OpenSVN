[package]
name = "svn-ra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
svn-types.workspace = true
svn-ra-api.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures-util.workspace = true
reqwest = { workspace = true, features = ["rustls-no-provider", "stream", "system-proxy"] }
# `ring` provider: smaller C/asm surface than aws-lc-rs; FIPS and post-quantum key exchange are not
# MVP requirements (see ADR-003).
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-platform-verifier.workspace = true
secrecy.workspace = true
sha2.workspace = true
base64.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = ["io"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["std", "fmt"] }
url.workspace = true
x509-parser.workspace = true

[dev-dependencies]
# Fixture replay and hostile-server tests parse what the transport delivers.
svn-protocol.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
proptest.workspace = true
rcgen.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
wiremock.workspace = true
