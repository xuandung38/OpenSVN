[package]
name = "svn-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "High-level Subversion client operations over svn-wc and svn-ra-api"

[lints]
workspace = true

[features]
# Crash-injection points (`fail::fail_point!`); enabled only by tests and the crash suite.
failpoints = ["dep:fail", "fail/failpoints", "svn-wc/failpoints"]

[dependencies]
async-trait.workspace = true
bytes.workspace = true
md-5.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
svn-ra-api.workspace = true
svn-types.workspace = true
svn-wc.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "rt", "sync"] }
tracing.workspace = true
fail = { workspace = true, optional = true }

[dev-dependencies]
opensvn-svn-oracle = { path = "../../tests/svn-oracle" }
svn-ra-api = { path = "../svn-ra-api", features = ["fake"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
