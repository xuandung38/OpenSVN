[package]
name = "updater-harness"
version = "0.0.0"
edition = "2024"
publish = false
description = "Drives tauri-plugin-updater against a local static server (release tooling, not shipped)"

# Standalone: kept out of the engine workspace so the pinned updater plugin and its HTTP stack do
# not enter the app's dependency graph until the app registers the plugin itself.
[workspace]

[dependencies]
# Versions are exact pins; keep tauri in step with the root Cargo.toml.
tauri = { version = "=2.12.3", default-features = false, features = ["test"] }
tauri-plugin-updater = "=2.13.3"
semver = "=1.0.28"
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "macros"] }
serde_json = "=1.0.154"
