name: release

# Builds UNSIGNED installers for the three desktop OSes with the real engine (cargo feature
# `release`) and attaches them to a DRAFT GitHub release in this repository:
#   Windows  MSI (WiX) + NSIS setup.exe            features: release (Negotiate = SSPI)
#   macOS    universal DMG, ad-hoc signed          features: release,negotiate-gssapi
#   Linux    AppImage + .deb (built on 22.04)      features: release,negotiate-gssapi
#
# Unsigned installers are the normal, documented output (the PO does not need signed builds).
# Nothing here needs a secret. Signing and the updater are optional placeholders, switched on only
# when the matching secrets / variables exist (see "Signing placeholders" and "Updater
# placeholders" below, and packaging/updater/README.md). Install instructions for the test builds:
# docs/INSTALL-TEST.md.

on:
  # Tag v0.0.2 stamps version 0.0.2. MSI (WiX) only accepts a numeric pre-release, so use tags
  # like v0.0.1-1, not v0.0.1-test1, or the Windows job fails.
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        # WiX (MSI) only accepts a numeric pre-release: 0.0.1-2 works, 0.0.1-test2 fails on Windows.
        description: "Version to stamp (semver, e.g. 0.0.2 or 0.0.1-2). Empty = workspace version."
        required: false
        default: ""
      release_tag:
        description: "Tag of the draft release to create (e.g. v0.0.1-test2). Empty = artifacts only."
        required: false
        default: ""
      updater:
        description: "Also build signed updater artifacts (needs TAURI_SIGNING_PRIVATE_KEY + vars.OPENSVN_UPDATER_PUBKEY)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Semver override for stamp-version.mjs. Tag pushes use the tag without its leading "v" (see the
  # "Stamp version" step); a manual run with an empty input uses [workspace.package] version.
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2025
            bundles: msi,nsis
            features: release
            target: ""
            bundle_dir: target/release/bundle
            patterns: "msi/*.msi nsis/*-setup.exe"
          - name: macos-universal
            os: macos-15
            bundles: dmg
            features: release,negotiate-gssapi
            target: universal-apple-darwin
            bundle_dir: target/universal-apple-darwin/release/bundle
            patterns: "dmg/*.dmg"
          # 22.04: the AppImage inherits the build host's glibc, so build on the oldest supported.
          - name: linux
            os: ubuntu-22.04
            bundles: appimage,deb
            features: release,negotiate-gssapi
            target: ""
            bundle_dir: target/release/bundle
            patterns: "appimage/*.AppImage deb/*.deb"
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        # libkrb5-dev + libclang-dev: the `negotiate-gssapi` feature (bindgen over gssapi.h).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf file \
            libkrb5-dev libclang-dev
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add both macOS targets for the universal binary
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.name }}
      - name: Install cargo-about (third-party license report)
        run: cargo install cargo-about --locked --version 0.9.2 --features cli

      - name: Stamp version
        id: version
        run: |
          if [[ -z "$RELEASE_VERSION" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
            export RELEASE_VERSION
            echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          fi
          echo "version=$(node scripts/release/stamp-version.mjs)" >> "$GITHUB_OUTPUT"
      - name: Generate third-party licenses
        run: scripts/release/gen-licenses.sh

      # ---- Signing placeholders -------------------------------------------------------------
      # macOS: with secret APPLE_SIGNING_IDENTITY (+ APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
      #   and for notarization APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID) Tauri signs with Developer
      #   ID and notarizes. Without it the app is ad-hoc signed ("-"), hardened runtime off.
      # Windows: with secret WINDOWS_SIGN_COMMAND (Authenticode, e.g. signtool / Azure Trusted
      #   Signing, "%1" = file; no passwords in the command) Tauri signs MSI, NSIS and the exe.
      #   Without it the installers are unsigned (SmartScreen warns).
      - name: Signing config
        id: signing
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
        run: |
          mkdir -p packaging/generated
          conf=packaging/generated/tauri.sign.ci.conf.json
          case "$RUNNER_OS" in
            macOS)
              if [[ -n "$APPLE_SIGNING_IDENTITY" ]]; then
                echo '{}' > "$conf"; echo "mode=developer-id" >> "$GITHUB_OUTPUT"
              else
                echo '{"bundle":{"macOS":{"signingIdentity":"-","hardenedRuntime":false}}}' > "$conf"
                echo "mode=ad-hoc" >> "$GITHUB_OUTPUT"
              fi ;;
            Windows)
              if [[ -n "$WINDOWS_SIGN_COMMAND" ]]; then
                jq -n --arg c "$WINDOWS_SIGN_COMMAND" '{bundle:{windows:{signCommand:$c}}}' > "$conf"
                echo "mode=authenticode" >> "$GITHUB_OUTPUT"
              else
                echo '{}' > "$conf"; echo "mode=unsigned" >> "$GITHUB_OUTPUT"
              fi ;;
            *) echo '{}' > "$conf"; echo "mode=unsigned" >> "$GITHUB_OUTPUT" ;;
          esac

      # ---- Updater placeholders -------------------------------------------------------------
      # Off unless the `updater` input is true. Needs secret TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD)
      # in a protected environment and variable OPENSVN_UPDATER_PUBKEY (minisign public key).
      # Publishing installers + latest.json to the private OpenSVN-releases repository is a manual
      # step for now (packaging/updater/README.md, "Release steps").
      - name: Updater config
        if: inputs.updater
        env:
          OPENSVN_UPDATER_PUBKEY: ${{ vars.OPENSVN_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [[ -n "$OPENSVN_UPDATER_PUBKEY" && -n "$TAURI_SIGNING_PRIVATE_KEY" ]] \
            || { echo "::error::updater=true needs vars.OPENSVN_UPDATER_PUBKEY and secrets.TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          node scripts/release/write-updater-config.mjs

      - name: Build installers
        working-directory: apps/opensvn
        env:
          OPENSVN_UPDATER: ${{ inputs.updater && '1' || '0' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.updater && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.updater && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FEATURES: ${{ matrix.features }}
          BUNDLES: ${{ matrix.bundles }}
          TARGET: ${{ matrix.target }}
        run: |
          gen=../../packaging/generated
          args=(--bundles "$BUNDLES" --features "$FEATURES"
            --config src-tauri/tauri.bundle.conf.json
            --config "$gen/tauri.version.conf.json"
            --config "$gen/tauri.sign.ci.conf.json")
          if [[ -n "$TARGET" ]]; then args+=(--target "$TARGET"); fi
          if [[ "$OPENSVN_UPDATER" == "1" ]]; then args+=(--config "$gen/tauri.updater.conf.json"); fi
          # Empty secrets must not reach Tauri as empty strings (it would try to sign with them).
          for v in APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID \
                   APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!v}" ]]; then unset "$v"; fi
          done
          pnpm tauri build "${args[@]}"

      - name: Collect installers
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUNDLE_DIR: ${{ matrix.bundle_dir }}
          PATTERNS: ${{ matrix.patterns }}
        run: |
          rm -f packaging/generated/tauri.sign.ci.conf.json
          mkdir -p dist
          shopt -s nullglob
          for p in $PATTERNS; do
            # shellcheck disable=SC2206 # $p is a glob on purpose
            files=("$BUNDLE_DIR"/$p)
            [[ ${#files[@]} -ge 1 ]] || { echo "::error::no installer matches $BUNDLE_DIR/$p"; exit 1; }
            for f in "${files[@]}"; do
              cp -f "$f" dist/
              if [[ -f "$f.sig" ]]; then cp -f "$f.sig" dist/; fi
            done
          done
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum -- * > "SHA256SUMS-${{ matrix.name }}.txt"
          else shasum -a 256 -- * > "SHA256SUMS-${{ matrix.name }}.txt"; fi
          ls -l
          echo "Version $VERSION, signing: ${{ steps.signing.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opensvn-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: opensvn-*
          merge-multiple: true
      - name: Create the draft release (never published by this workflow)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          ls -l dist
          notes="Unsigned test build (real engine). Windows: SmartScreen -> More info -> Run anyway.
          macOS: ad-hoc signed; right-click -> Open, or: xattr -dr com.apple.quarantine /Applications/OpenSVN.app.
          Linux: see docs/INSTALL-TEST.md. Verify downloads with the SHA256SUMS-*.txt files."
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --prerelease \
            --target "$GITHUB_SHA" --title "$TAG (unsigned test build)" --notes "$notes"
