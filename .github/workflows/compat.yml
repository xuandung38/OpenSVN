name: compat

# Builds the pinned svn 1.14.5 / 1.15.0 server and client images, loads fixtures, and runs the
# harness self-check scenarios (svn vs svn). Engine scenarios from other work packages are
# added to tests/compat/scenarios/ and picked up by `cargo xtask compat run` once they exist.
on:
  pull_request:
    paths:
      - "docker/**"
      - "fixtures/**"
      - "xtask/**"
      - "tests/compat/**"
      - "crates/svn-protocol/**"
      - "crates/svn-ra/**"
      - "crates/svn-wc/**"
      - "crates/svn-client/**"
      - "apps/opensvn/src-tauri/src/engine/**"
      - "apps/opensvn/src-tauri/tests/real_engine_dav.rs"
      - "scripts/test-env/engine-wc-old-client.sh"
      - ".github/workflows/compat.yml"
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "fixtures/**"
      - "xtask/**"
      - "tests/compat/**"
      - "crates/svn-protocol/**"
      - "crates/svn-ra/**"
      - "crates/svn-wc/**"
      - "crates/svn-client/**"
      - "apps/opensvn/src-tauri/src/engine/**"
      - "apps/opensvn/src-tauri/tests/real_engine_dav.rs"
      - "scripts/test-env/engine-wc-old-client.sh"
      - ".github/workflows/compat.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fixtures contain no real hosts or credentials
        run: fixtures/check-no-real-hosts.sh

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Layer cache in the GitHub Actions cache (no secrets needed). A local `source` makes bake
      # run from docker/ (like `cd docker && docker buildx bake -f compose.yml`), so the compose
      # contexts `./svn-server` / `./svn-client` resolve there; the default git context does not.
      # Pull requests only read the cache; main refreshes it. A cache outage never fails the job.
      # Bake ignores compose `profiles`, so the targets are listed explicitly: without this list
      # every PR would also compile the 1.8/1.9/1.10 legacy images.
      - name: Build images
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: ./docker
          files: ./compose.yml
          targets: certs,svn14-server,svn14-client,svn15-server,svn15-client
          load: true
          set: |
            *.args.SVN_MAKE_JOBS=4
            *.cache-from=type=gha,scope=compat-images
            ${{ github.event_name == 'push' && '*.cache-to=type=gha,scope=compat-images,mode=max,ignore-error=true' || '' }}

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Unit tests (no Docker)
        run: cargo test -p opensvn-compat -p xtask --locked

      - name: Start compat environment
        run: cargo xtask compat up --no-build

      - name: Create fixture repos (verifies pinned dump hashes)
        run: cargo xtask compat fixtures

      - name: Harness self-check (svn15 vs svn15, svn14 vs svn15)
        run: cargo xtask compat run

      # The engine (crash-worker: svn-ra + svn-client + svn-wc) checks out, commits and updates;
      # then svn 1.14.5 (the compat client image) runs status, commit and update on the same
      # working copy, and the engine takes it back. Server: a throwaway local mod_dav_svn.
      - name: svn 1.14.5 client on engine-created working copies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends subversion apache2 libapache2-mod-svn
          cargo build -p opensvn-crash --bin crash-worker --locked
          scripts/test-env/engine-wc-old-client.sh target/debug/crash-worker

      - name: Docker-backed tests
        run: cargo test -p opensvn-compat --locked -- --ignored

      # The app's real engine (RealEngine + HttpConnector) runs the shared engine suite against
      # both servers. The app crate needs the Tauri system libraries and the built frontend.
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev patchelf
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Build frontend (embedded by the Tauri context macro)
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Real engine conformance against Apache + mod_dav_svn
        run: >-
          cargo test -p opensvn --features real-engine,engine-conformance --locked
          --test real_engine_dav -- --ignored

      - name: Server logs on failure
        if: failure()
        run: |
          docker compose -f docker/compose.yml -p opensvn-compat ps -a
          docker compose -f docker/compose.yml -p opensvn-compat logs --no-color --tail 200 || true

      - name: Tear down
        if: always()
        run: cargo xtask compat down

  # Nightly / manual: the MVP flows of doc 01 section 10 on the real app (tauri-driver +
  # WebKitWebDriver under Xvfb) against the svn 1.15 Apache container. See apps/opensvn/e2e/.
  e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build images
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: ./docker
          files: ./compose.yml
          targets: certs,svn14-server,svn14-client,svn15-server,svn15-client
          load: true
          set: |
            *.args.SVN_MAKE_JOBS=4
            *.cache-from=type=gha,scope=compat-images
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Tauri system libraries, WebKitWebDriver, Xvfb and the svn client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev patchelf webkit2gtk-driver xvfb subversion
      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install frontend dependencies
        working-directory: apps/opensvn
        run: pnpm install --frozen-lockfile
      - name: Start compat environment
        run: cargo xtask compat up --no-build
      - name: End-to-end flows
        working-directory: apps/opensvn
        run: pnpm e2e
      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-artifacts
          path: apps/opensvn/e2e-artifacts
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: cargo xtask compat down

  # Nightly / manual: servers and clients 1.8.19, 1.9.12 and 1.10.8 (image compile is slow, so not on PRs).
  legacy:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      COMPOSE_PROFILES: legacy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # `run --legacy` also runs the default scenarios (svn14/svn15) and the legacy smokes read
      # svn15 working copies, so this job needs every target, listed explicitly.
      - name: Build images
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: ./docker
          files: ./compose.yml
          targets: certs,svn14-server,svn14-client,svn15-server,svn15-client,svn110-server,svn110-client,svn19-server,svn19-client,svn18-server,svn18-client
          load: true
          set: |
            *.args.SVN_MAKE_JOBS=4
            *.cache-from=type=gha,scope=compat-images
            *.cache-to=type=gha,scope=compat-images,mode=max,ignore-error=true
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask compat up --no-build --legacy
      - run: cargo xtask compat fixtures --legacy
      - run: cargo xtask compat run --legacy
      - name: Tear down
        if: always()
        run: cargo xtask compat down
