name: nightly

# Crash suite (random SIGKILL + named failpoints) and benchmarks against the svn CLI, both on a
# local Apache + mod_dav_svn. Ubuntu 24.04 packages Subversion 1.14.3, so the server and the CLI
# baseline are 1.14.3 here; the crash suite's oracle client is svn 1.15.0, built from source
# (.github/actions/install-svn-115), which also lets the concurrency suite run. Also: memory of a
# 1 GiB transfer, Linux Secret Service round trip. The app job runs the real app (tauri-driver
# under Xvfb): crash e2e, RSS on a 100k-file working copy, a 10 min soak.
on:
  schedule:
    - cron: "17 19 * * *" # 02:17 Asia/Ho_Chi_Minh
  workflow_dispatch:
    inputs:
      random_iters:
        description: Random SIGKILL cases per operation
        default: "120"
      fp_iters:
        description: Kills per reachable failpoint (at least 50)
        default: "50"
      bench_files:
        description: Text files in the benchmark repository
        default: "100000"

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  OPENSVN_REQUIRE_SVN: "1"

jobs:
  crash:
    name: crash suite
    runs-on: ubuntu-24.04
    # 50 kills per failpoint (19 failpoints) plus 7 x 120 random kills.
    timeout-minutes: 300
    env:
      # 7 operations x 120 random kills + 19 failpoints x 50 kills: over 1700 crash cases a night.
      CRASH_RANDOM_ITERS: ${{ inputs.random_iters || '120' }}
      CRASH_FP_ITERS: ${{ inputs.fp_iters || '50' }}
      CRASH_FILES: "200"
      CRASH_REPORT_DIR: ${{ github.workspace }}/crash-report
      CRASH_KEEP_FAILED: "5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Subversion and Apache mod_dav_svn
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends subversion apache2 libapache2-mod-svn
          svn --version --quiet
      - name: Install Subversion 1.15 (oracle client)
        uses: ./.github/actions/install-svn-115
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build
        run: cargo test -p opensvn-crash --features failpoints --locked --no-run
      - name: Random SIGKILL
        id: sigkill
        run: cargo test -p opensvn-crash --features failpoints --locked --test sigkill -- --ignored --nocapture
      - name: Named failpoints
        id: failpoints
        if: success() || failure()
        run: cargo test -p opensvn-crash --features failpoints --locked --test failpoints -- --ignored --nocapture
      - name: Concurrency with the svn 1.15 CLI
        if: (success() || failure()) && hashFiles('tests/crash/tests/concurrency.rs') != ''
        run: cargo test -p opensvn-crash --features failpoints --locked --test concurrency -- --ignored --nocapture
      - name: Summary
        if: always()
        run: cat crash-report/*.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Collect failed working copies
        if: failure()
        run: |
          mkdir -p crash-report/kept
          for d in /tmp/opensvn-crash-failed-*; do [ -e "$d" ] && sudo cp -a "$d" crash-report/kept/ || true; done
          sudo chown -R "$(id -u):$(id -g)" crash-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: crash-report
          path: crash-report
          retention-days: 14

  transport-and-keyring:
    name: 1 GiB transfer memory, Secret Service round trip
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install D-Bus and gnome-keyring
        run: scripts/test-env/secret-service-roundtrip.sh install
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # 1 GiB down and 1 GiB up through TLS; fails when peak RSS grows by 50 MiB or more
      # (docs/visualsvn-test-env.md records the usual growth).
      - name: 1 GiB download and upload keep memory flat (release)
        # Explicit bash runs with pipefail: a failing test fails the step despite `tee`.
        shell: bash
        run: |
          cargo test --release -p svn-ra --locked --test transport_streaming \
            -- --ignored --exact one_gib_download_and_upload_keep_memory_flat --nocapture \
            | tee transport-memory.txt
          grep '^download' transport-memory.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: Secret Service round trip (headless gnome-keyring)
        run: scripts/test-env/secret-service-roundtrip.sh --locked

  bench:
    name: benchmarks vs svn CLI
    runs-on: ubuntu-24.04
    # Today's engine needs about 16 min per 100k-file checkout (#121), so two repetitions.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space (two 100k-file working copies + repository)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install Subversion and Apache mod_dav_svn
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends subversion apache2 libapache2-mod-svn jq
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build (release)
        run: cargo build --release --locked -p opensvn-bench
      - name: Run
        run: |
          target/release/compare-svn --files "${{ inputs.bench_files || '100000' }}" \
            --binaries 4 --binary-mb 64 --update-files 10000 --reps 2 \
            --out bench-report/bench.md
      - name: Log over 100k revisions
        if: success() || failure()
        run: target/release/compare-svn-log --revisions 100000 --reps 3 --out bench-report/log.md
      - name: Commit of 1k files
        if: success() || failure()
        run: |
          target/release/compare-svn-commit --files 1000 --modify-files 1000 --big-mb 40 --reps 3 \
            --out bench-report/commit-1k.md
      - name: Summary and regression warnings
        if: always()
        run: |
          cat bench-report/*.md >> "$GITHUB_STEP_SUMMARY" || exit 0
          # Warn when the engine is more than 10% slower than the svn CLI.
          for f in bench-report/*.json; do
            jq -r '.[] | select(.ratio > 1.10) | "::warning title=slower than svn CLI::\(.op): engine \(.engine_s)s vs svn \(.svn_s)s (x\(.ratio))"' "$f" || true
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bench-report
          path: bench-report
          retention-days: 90

  app:
    name: app crash, RSS and soak (real app)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      OPENSVN_CRASH_ITERS: "6"
      OPENSVN_SOAK_MINUTES: "10"
      OPENSVN_E2E_ARTIFACTS: ${{ github.workspace }}/app-report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space (100k-file working copy + repository, two app builds)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install Tauri libraries, WebKitWebDriver, Xvfb, a Secret Service and Apache
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev patchelf webkit2gtk-driver xvfb dbus-x11 gnome-keyring
          scripts/test-env/visualsvn-like.sh install
      - name: Install Subversion 1.15 (oracle client)
        uses: ./.github/actions/install-svn-115
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install frontend dependencies
        working-directory: apps/opensvn
        run: pnpm install --frozen-lockfile
      - name: Start Apache + mod_dav_svn (HTTPS, Basic)
        run: |
          scripts/test-env/visualsvn-like.sh up
          scripts/test-env/visualsvn-like.sh env | sed -n "s/^export \([A-Z_]*\)='\(.*\)'$/\1=\2/p" >> "$GITHUB_ENV"
          echo "OPENSVN_COMPAT_LOCAL_URL=https://svn.opensvn.test:18443/svn-basic" >> "$GITHUB_ENV"
          echo "NO_PROXY=svn.opensvn.test,svnhost" >> "$GITHUB_ENV"
      - name: Crash e2e (debug build with failpoints)
        id: crash
        working-directory: apps/opensvn
        run: pnpm e2e:crash
      - name: RSS on a 100k-file working copy (release build)
        id: rss
        if: success() || failure()
        working-directory: apps/opensvn
        run: pnpm e2e:rss
      - name: Soak, 10 minutes (release build)
        if: success() || failure()
        working-directory: apps/opensvn
        run: OPENSVN_E2E_SKIP_BUILD=1 pnpm e2e:soak
      - name: Summary
        if: always()
        run: cat app-report/*.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: app-report
          path: app-report
          retention-days: 30
