[package]
name = "opensvn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "opensvn"
description = "OpenSVN desktop app (Tauri 2)"

[lints]
workspace = true

[lib]
name = "opensvn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# IPC codegen helper (`pnpm gen:ipc`). Behind a feature so installers, which bundle every binary of
# this package, ship only `opensvn`.
[[bin]]
name = "gen_ipc"
path = "src/bin/gen_ipc.rs"
required-features = ["gen-ipc"]

[build-dependencies]
tauri-build.workspace = true
# Reads tauri*.conf.json to refuse updater `dangerous*` TLS options at build time.
serde_json.workspace = true

[dependencies]
opensvn-ipc = { path = "../../../crates/opensvn-ipc" }
svn-types.workspace = true
# OS credential store (Keychain, Credential Manager, Secret Service) for the updater token.
secure-store.workspace = true
# `RedactingMakeWriter` wraps every log sink (stderr and the log file) so secrets never reach logs.
svn-ra.workspace = true
tracing-subscriber = { workspace = true, features = ["std", "fmt", "registry"] }
# Line diffs: display budget (`tooComplex`) for both engines, blame matching for the real one.
svn-diff.workspace = true
# Text of Word/Excel files for the Office diff.
office-text.workspace = true
# Only needed by the real engine (working copy database, client operations, upload checksums,
# journal file names).
svn-wc = { workspace = true, optional = true }
svn-client = { workspace = true, optional = true }
svn-delta = { workspace = true, optional = true }
md-5 = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
# The session URL check reuses the protocol layer's root comparison.
svn-protocol = { workspace = true, optional = true }
# Case-insensitive matching of request paths against wc.db (macOS, Windows).
unicode-normalization = { workspace = true, optional = true }
# Arms a failpoint from the environment for the app-level crash tests (`failpoints` only).
fail = { workspace = true, optional = true }
# `fake` ships the in-memory repository that backs FakeEngine (the engine of builds without the
# `real-engine` feature, and of `OPENSVN_ENGINE=fake`).
svn-ra-api = { workspace = true, features = ["fake"] }
# `protocol-asset` is required for the scoped asset protocol (image diffs); its scope is pinned to
# the app temp dir in tauri.conf.json.
tauri = { workspace = true, features = ["protocol-asset"] }
# Opens https links in the default browser. Only `opener:allow-open-url` with an https-only scope is
# granted in capabilities; no path, reveal or other scheme permission.
tauri-plugin-opener = "=2.7.1"
# OS notifications are shown from Rust only (new revisions); no notification permission is granted
# to the WebView.
tauri-plugin-notification = "=2.6.0"
# Updates come from a private GitHub releases repository. The read token is kept in the credential
# store (`updater/github-token`), never in settings or the binary; no updater permission is granted
# to the WebView (the app exposes its own `update_check` / `update_install` commands).
# Without the `zip` feature: the updater artifacts are the signed `-setup.exe` (Windows) and
# `.AppImage` (Linux), never the v1 `.zip`/`.tar.gz` wrappers, and that feature pulls zip 4
# (RUSTSEC-2026-0367/0368/0369). The macOS `.app.tar.gz` does not depend on it.
tauri-plugin-updater = { version = "=2.13.3", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }
specta.workspace = true
specta-typescript.workspace = true
serde.workspace = true
secrecy.workspace = true
serde_json.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures-util = { workspace = true, features = ["std"] }
rusqlite.workspace = true
notify.workspace = true
time = { workspace = true, features = ["std", "formatting"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
# Same version as tauri-plugin-updater uses: its redirect policy and sensitive header types are
# passed to the updater's HTTP client.
reqwest.workspace = true
# Pinned here rather than in the workspace table until another crate needs them.
uuid = { version = "=1.28.0", default-features = false, features = ["v7"] }
# Process liveness and boot time for the working copy lock ownership probe (no unsafe in our code).
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
# Canonical paths without the Windows `\\?\` prefix (reveal in file manager).
dunce = "=1.0.5"
# Native file picker and confirmation dialogs for program settings (no JS plugin is registered).
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3"] }

[target.'cfg(unix)'.dependencies]
# `O_NOFOLLOW` / `ELOOP` for opening working files without following a swapped-in symlink.
libc = "=0.2.190"
# `CLOCK_BOOTTIME` (Linux) / `CLOCK_MONOTONIC` (macOS) for sleep detection (`wake.rs`).
rustix = { version = "=1.1.5", default-features = false, features = ["std", "time"] }

[features]
# Compiles in `engine::real::RealEngine`, the `EngineFacade` backed by the Subversion crates, and
# makes it the app's engine (`OPENSVN_ENGINE=fake` still selects the demo engine). Not a default
# feature yet: the rollout turns it on after the conformance run against Apache and a manual
# VisualSVN smoke test on all three OSes.
real-engine = [
  "dep:svn-wc",
  "dep:svn-client",
  "dep:svn-delta",
  "dep:md-5",
  "dep:sha1",
  "dep:unicode-normalization",
  "dep:svn-protocol",
]
# Feature set of the installers built by scripts/release/build-* and .github/workflows/release.yml
# (`pnpm tauri build --features release`): the real engine, without making it a cargo default.
# macOS and Linux installers add `negotiate-gssapi` on top.
release = ["real-engine"]
# Kerberos single sign-on on macOS/Linux through the system GSSAPI library (needs the krb5
# development headers and libclang to build). Off by default so CI builds without them; release
# builds for macOS and Linux turn it on. Windows always has SSPI. Users can switch Negotiate off in
# the network settings either way.
negotiate-gssapi = ["svn-ra/negotiate-gssapi"]
# Builds the `gen_ipc` binary (TypeScript bindings); never enabled for installers.
gen-ipc = []
# Exposes `engine::conformance`, the engine-independent test suite every `EngineFacade` must pass.
engine-conformance = []
# Crash-injection points of the working copy layer, for the real engine's crash recovery tests
# (`cargo test -p opensvn --features failpoints`). Never enabled in a release build.
failpoints = ["real-engine", "svn-client/failpoints", "dep:fail"]

[dev-dependencies]
# Paused clock for deterministic select-ordering tests.
tokio = { workspace = true, features = ["test-util"] }
tauri = { workspace = true, features = ["test"] }
tempfile.workspace = true
proptest.workspace = true
# Scripted HTTPS Subversion server for the connector and broker acceptance tests.
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true
rcgen.workspace = true
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
# Native svn 1.15 for the real engine's oracle tests (skipped when it is missing).
opensvn-svn-oracle = { path = "../../../tests/svn-oracle" }
# Scenario runner and comparators of the two-way compat test (`tests/compat_two_way.rs`).
opensvn-compat = { path = "../../../tests/compat" }
anyhow.workspace = true
# Configures the failpoints of the `failpoints` feature in tests (inert without it).
fail.workspace = true
